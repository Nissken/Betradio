<!DOCTYPE html>
<html lang="sv">
  <head>
    <meta charset="utf-8">
    <title>BET RADIO</title>
    <link rel="stylesheet" href="Styles/vax.css"> 
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
  </head>
  <body>
    <header>
      <h1 class="container" id="banner">BET RADIO</h1>
      
    </header>
    <main>
      <div class="container" id="stream">
        <iframe src="http://betradio.tplinkdns.com/public/betradio/embed?volume=100" frameborder="0" height="100%" width="100%"></iframe>
      </div>
      <h1 id="midjan">
        <iframe class="container" id="historik" src="http://betradio.tplinkdns.com/public/betradio/history" frameborder="0" allowtransparency="true" style="width: 100%; min-height: 300px; height: 300px;"></iframe>
        <iframe class="container" id="requests" src="http://betradio.tplinkdns.com/public/betradio/embed-requests" frameborder="0" allowtransparency="true" style="width: 100%; height: 500px;"></iframe>
      </h1>
    </main>
    <footer>
      <div class="container">
        <p><a href="http://betradio.tplinkdns.com/public/betradio">Önska en låt</a></p>
        <separator>|</separator>
        <p><a href="http://betradio.tplinkdns.com/public/betradio/schedule">Program</a></p>
        <separator>|</separator>
        <p><a href="http://betradio.tplinkdns.com/station/1">Admin</a></p>
      </div>
    </footer>
  </body>
</html>
